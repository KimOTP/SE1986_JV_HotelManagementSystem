spring.application.name=SE1986_JV_HMS_be
# Doc bien moi truong local tu .env (khong commit); bien he thong van uu tien hon.
spring.config.import=optional:file:.env[.properties]

server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:HotelManagement_SBA};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Flyway: file db/migration/V*.sql chay theo thu tu khi khoi dong. Database moi chi can tao rong.
# Database da co du lieu truoc khi dung Flyway duoc coi nhu da o V2 (schema + seed), V3 tro di se tu chay.
spring.flyway.enabled=true
spring.flyway.schemas=dbo,identity_access,inventory,booking,billing,operations
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# JWT: secret la chuoi Base64 >= 32 byte, chi dat trong .env hoac bien moi truong.
# Bo trong thi app tu sinh khoa tam (token mat hieu luc sau moi lan restart).
app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.jwt.issuer=${JWT_ISSUER:se1986-hms}
app.jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
app.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:604800}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Giữ phòng cho booking PENDING: 15 phút. Quá hạn thì phòng được nhả cho khách
# khác (procedure tìm phòng dựa vào hold_expires_at) và job chuyển sang EXPIRED.
booking.hold-minutes=${BOOKING_HOLD_MINUTES:15}
booking.hold-scan-ms=${BOOKING_HOLD_SCAN_MS:60000}
booking.hold-scan-initial-ms=${BOOKING_HOLD_SCAN_INITIAL_MS:15000}

# Gui ma OTP dat lai mat khau qua SMTP. De trong MAIL_HOST thi chi ghi log (dung khi phat trien).
# Gmail: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME=<email>, MAIL_PASSWORD=<mat khau ung dung>.
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:}
app.mail.starttls=${MAIL_STARTTLS:true}

app.otp.ttl-minutes=${OTP_TTL_MINUTES:10}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
