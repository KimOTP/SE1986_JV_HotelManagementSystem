spring.application.name=SE1986_JV_HMS_be
# Doc bien moi truong local tu .env (khong commit); bien he thong van uu tien hon.
spring.config.import=optional:file:.env[.properties]

server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=HotelManagement_SBA;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# JWT: secret la chuoi Base64 >= 32 byte, chi dat trong .env hoac bien moi truong.
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=${JWT_ISSUER:se1986-hms}
app.jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
app.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:604800}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
