spring.application.name=SE1986_JV_HMS_be

server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=HotelManagement_SBA;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Used only with the explicit local-demo Spring profile. Keep disabled by default.
operations.demo-reporter-email=${OPERATIONS_DEMO_REPORTER_EMAIL:}
operations.demo-manager-email=${OPERATIONS_DEMO_MANAGER_EMAIL:}
operations.demo-staff-email=${OPERATIONS_DEMO_STAFF_EMAIL:}
