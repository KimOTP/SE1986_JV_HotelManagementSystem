# Render Blueprint: New > Blueprint, chọn repo này. Các biến "sync: false" nhập tay trên Render.
services:
  - type: web
    name: hms-be
    runtime: docker
    rootDir: SE1986_JV_HMS_be
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "1433"
      - key: DB_NAME
        value: HotelManagement_SBA
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET_BASE64
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: INVENTORY_DEFAULT_HOTEL_ID
        value: "1"
      - key: INVENTORY_IMAGE_BASE_URL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: BOOKING_PAYOS_ENABLED
        value: "true"
      - key: BOOKING_PAYOS_CLIENT_ID
        sync: false
      - key: BOOKING_PAYOS_API_KEY
        sync: false
      - key: BOOKING_PAYOS_CHECKSUM_KEY
        sync: false
      - key: BOOKING_PAYOS_FRONTEND_URL
        sync: false
      - key: BOOKING_PAYOS_ORDER_OFFSET
        sync: false
      - key: BOOKING_PAYOS_RECEIVER_BIN
        sync: false
      - key: BOOKING_PAYOS_RECEIVER_NAME
        sync: false
      # Gửi mail qua Brevo. Dùng cổng 2525 vì Render Free có thể chặn cổng 587.
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
