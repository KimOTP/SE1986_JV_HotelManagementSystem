    <path d="M40 96c-7-2-11-7-12-12 6 0 11 4 12 12Z" fill="#123F63" stroke="none"/>
    <path d="M40 96c7-2 11-7 12-12-6 0-11 4-12 12Z" fill="#123F63" stroke="none"/>
