    <path d="M214 102c-6-2-9-6-10-10 5 0 9 3 10 10Z" fill="#123F63" stroke="none"/>
    <path d="M214 102c6-2 9-6 10-10-5 0-9 3-10 10Z" fill="#123F63" stroke="none"/>
  </g>

