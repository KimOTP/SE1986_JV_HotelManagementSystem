    <rect x="80" y="82" width="6" height="7" rx="1"/>
    <rect x="80" y="96" width="6" height="7" rx="1"/>
    <rect x="90" y="68" width="6" height="7" rx="1"/>
    <rect x="90" y="96" width="6" height="7" rx="1"/>

    <rect x="112" y="52" width="7" height="8" rx="1"/>
    <rect x="124" y="52" width="7" height="8" rx="1"/>
    <rect x="136" y="52" width="7" height="8" rx="1"/>
    <rect x="112" y="68" width="7" height="8" rx="1"/>
    <rect x="136" y="68" width="7" height="8" rx="1"/>
    <rect x="112" y="84" width="7" height="8" rx="1"/>
    <rect x="124" y="84" width="7" height="8" rx="1"/>
    <rect x="136" y="100" width="7" height="8" rx="1"/>

    <rect x="156" y="76" width="6" height="7" rx="1"/>
    <rect x="166" y="76" width="6" height="7" rx="1"/>
    <rect x="156" y="92" width="6" height="7" rx="1"/>
    <rect x="166" y="92" width="6" height="7" rx="1"/>
  </g>

  <!-- sảnh dưới -->
  <rect x="100" y="104" width="52" height="14" fill="#0E3459" opacity=".9"/>
  <g fill="#F2C14E" opacity=".85">
