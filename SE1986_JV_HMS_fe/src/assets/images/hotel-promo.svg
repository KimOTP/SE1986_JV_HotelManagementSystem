<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 170" width="260" height="170" role="img" aria-label="Khu nghỉ dưỡng HMS về đêm">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2540"/>
      <stop offset=".55" stop-color="#164B7E"/>
      <stop offset="1" stop-color="#2E7BC4"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#D7E4F5"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B2C4C"/>
      <stop offset="1" stop-color="#061A2E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F2C14E" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F2C14E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="260" height="170" fill="url(#sky)"/>
  <g fill="#FFFFFF" opacity=".45">
    <circle cx="26" cy="24" r="1.1"/>
    <circle cx="58" cy="14" r=".8"/>
    <circle cx="96" cy="28" r="1"/>
    <circle cx="150" cy="16" r=".7"/>
    <circle cx="196" cy="30" r="1.1"/>
    <circle cx="232" cy="18" r=".8"/>
  </g>
  <circle cx="214" cy="42" r="13" fill="#FDF6E3" opacity=".9"/>
  <circle cx="219" cy="38" r="12" fill="#164B7E" opacity=".85"/>

  <!-- toà nhà chính -->
  <path d="M74 118V60l14-9 14 9v58Z" fill="url(#facade)"/>
  <path d="M88 48.5 102 60H74l14-11.5Z" fill="#C9D9EE"/>
  <path d="M74 118V60l14-9v67Z" fill="#FFFFFF" opacity=".25"/>

  <!-- tháp giữa -->
  <path d="M104 118V44h44v74Z" fill="url(#facade)"/>
  <path d="M104 44h44l-4-8h-36l-4 8Z" fill="#B9CDE6"/>
  <rect x="112" y="30" width="28" height="8" rx="2" fill="#E8B44A"/>

  <!-- tháp phải -->
  <path d="M150 118V66l12-7 12 7v52Z" fill="url(#facade)"/>
  <path d="M162 59l12 7h-24l12-7Z" fill="#C9D9EE"/>

  <!-- cửa sổ sáng đèn -->
  <g fill="#F2C14E" opacity=".92">
